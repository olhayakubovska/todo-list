{% extends "base.html" %}

{% block content %}
<h1 class="display-5 fw-semibold mb-4">Delete task</h1>
<p>Are you sure you want to delete "{{ object.content }}"?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Yes, delete</button>
  <a class="btn btn-secondary" href="{% url 'todo:task-list' %}">Cancel</a>
</form>
{% endblock %}
